<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Terrain</title>
    <meta property="og:description" content="Go beyond hillshade and show elevation in actual 3D." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl/dist/maplibre-gl.js'></script>
    <script src='https://unpkg.com/@geomatico/maplibre-cog-protocol/dist/index.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #info {
          display: none;
          position: absolute;
          top: 0;
          left: 0;
          background: #2d2d2d;
          border: 1px solid #bbbbbb;
          color: #bbbbbb;
          padding: 6px;
          border-radius: 5px;
          font-family: monospace;
          font-size: 18px;
      }
    </style>
</head>
<body>
<div id="map"></div>
<div id="info"></div>
<script>
    maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        zoom: 13,
        center: [7.0, 46.215],
        pitch: 70,
        hash: true,
        style: {
            version: 8,
            sources: {
                osm: {
                    type: 'raster',
                    tiles: ['https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg'],
                    tileSize: 256,
                    attribution: '&copy; OpenStreetMap Contributors',
                    maxzoom: 19
                },
                terrainSource: {
                    type: 'raster-dem',
                    url: 'cog://https://api.guidos.fun/swissaltiregio/swissaltiregio_3857_uint16_cog.tif2',
                    tileSize: 256,
                    minzoom: 6,
                    maxzoom: 16
                }
            },
            layers: [
                {
                    id: 'osm',
                    type: 'raster',
                    source: 'osm'
                }
            ],
            terrain: {
                source: 'terrainSource',
                exaggeration: 0.01
            },
            sky: {}
        },
        maxZoom: 18,
        maxPitch: 85
    }));

    map.addControl(
        new maplibregl.NavigationControl({
            visualizePitch: true,
            showZoom: true,
            showCompass: true
        })
    );

    map.addControl(
        new maplibregl.TerrainControl({
            source: 'terrainSource',
            exaggeration: 0.01
        })
    );

    map.on('mousemove', (e) => {
    const {lngLat: {lat: latitude, lng: longitude}, point: {x, y}} = e;
    const zoom = map.getZoom();

    document.getElementById('info').style.left = x + 10 + 'px';
    document.getElementById('info').style.top = y + 20 + 'px';

    MaplibreCOGProtocol.locationValues('https://api.guidos.fun/swissaltiregio/swissaltiregio_3857_uint16_cog.tif2', {latitude, longitude}, zoom)
        .then(values => {
            const height = Math.round(values[0]);
            if (isNaN(height)) {
                map.getCanvas().style.cursor = '';
                document.getElementById('info').style.display = 'none';
            } else {
                map.getCanvas().style.cursor = 'default';
                document.getElementById('info').style.display = 'block';
                document.getElementById('info').innerHTML = `Height: <b> ${height} m</b>`;
            }
        });
    });
</script>
</body>
</html>
